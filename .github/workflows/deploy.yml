# main 에 push(= main_qa PR 머지)되면 배포한다.
#
#   앱:   app/build.gradle 의 versionCode 가 오른 커밋에서만
#         → 유닛 테스트 → bundleRelease(서명) → Play Console 프로덕션 트랙 업로드
#   태그: 앱 업로드가 성공한 커밋에 v{versionName}-b{versionCode} 태그와 GitHub 릴리스를 만든다
#         → 어느 커밋이 어느 버전으로 나갔는지 기록. 사람이 태그를 칠 일은 없다
#
# 조건을 거는 이유: 같은 versionCode 를 Play 에 두 번 올리면 거부된다.
# 버전을 안 올린 커밋은 스토어로 가면 안 된다.
#
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   PLAY_SERVICE_ACCOUNT_JSON Play Console 에 초대한 서비스 계정 키 JSON 내용 그대로
#   KEYSTORE_BASE64           서명 키스토어(.jks)를 base64 로 (base64 -w0 파일)
#   KEYSTORE_PASSWORD · KEY_ALIAS · KEY_PASSWORD
name: Deploy

on:
  push:
    branches: [main]

# 연달아 머지되면 앞 배포가 끝날 때까지 기다린다. 취소하면 반쯤 올라간 채로 남을 수 있다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    name: 무엇이 바뀌었나
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # 브랜치가 막 생겼거나(before 가 0) 이전 커밋을 못 찾으면 바뀐 것으로 본다
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "이전 커밋을 알 수 없어 앱을 배포 대상으로 둔다"
            exit 0
          fi

          if git diff "$BEFORE" HEAD -- app/build.gradle | grep -Eq '^\+\s*versionCode\s*='; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          echo "앱 versionCode: $(git diff "$BEFORE" HEAD -- app/build.gradle | grep -E '^[-+]\s*versionCode' || echo 변경없음)"

  play:
    name: 앱 배포 (Play 프로덕션)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: 시크릿 확인 · 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::시크릿이 없다:$missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-key.jks"

      # 깨진 앱을 올리지 않는다. ci.yml 과 같은 테스트다.
      - name: 유닛 테스트
        run: ./gradlew testDebugUnitTest --console=plain

      # build.gradle 에 signingConfig 가 없어 Gradle 의 injected 서명 속성으로 서명한다.
      - name: AAB 빌드 (서명)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --console=plain \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          ls -l app/build/outputs/bundle/release/

      - name: 버전·출시 노트 추출
        id: meta
        run: |
          code="$(grep -E '^\s*versionCode\s*=' app/build.gradle | grep -oE '[0-9]+')"
          name="$(grep -E '^\s*versionName\s*=' app/build.gradle | grep -oE '"[^"]+"' | tr -d '"')"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          # CHANGELOG 맨 위 항목의 "### 스토어 문구" 블록이 Play 의 "이 버전의 새로운 기능"이 된다.
          # (다음 ### 제목 전까지. 500자 제한은 CHANGELOG 머리말 참고)
          mkdir -p "$RUNNER_TEMP/whatsnew"
          awk '
            /^## v/ { if (seen) exit; seen = 1; next }
            seen && /^### 스토어 문구/ { grab = 1; next }
            seen && grab && /^### / { exit }
            grab { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' \
            > "$RUNNER_TEMP/whatsnew/whatsnew-ko-KR"

          if [ ! -s "$RUNNER_TEMP/whatsnew/whatsnew-ko-KR" ]; then
            echo "::error::CHANGELOG.md 맨 위 항목에 '### 스토어 문구' 블록이 없다"
            exit 1
          fi
          len="$(wc -m < "$RUNNER_TEMP/whatsnew/whatsnew-ko-KR")"
          if [ "$len" -gt 500 ]; then
            echo "::error::스토어 문구가 ${len}자다. Play 는 500자까지만 받는다"
            exit 1
          fi
          echo "--- v$name (b$code) 출시 노트 (${len}자) ---"
          cat "$RUNNER_TEMP/whatsnew/whatsnew-ko-KR"

      - name: Play Console 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.youngs.beatdrum
          # archivesBaseName 이 beatDrum_v{name}({code}) 라 파일명에 괄호가 들어간다. 글롭으로 받는다.
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: production
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          releaseName: v${{ steps.meta.outputs.name }} (b${{ steps.meta.outputs.code }})

      # Play 쪽에 문제가 있어도 여기서 받아 올릴 수 있다.
      - name: AAB 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beatDrum_v${{ steps.meta.outputs.name }}_b${{ steps.meta.outputs.code }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: ignore

  tag:
    name: 릴리스 태그 (GitHub)
    needs: [changes, play]
    # Play 에 올라간 커밋에만 붙인다. 업로드가 실패한 커밋에 태그가 붙으면 "나간 버전" 기록이 거짓이 된다.
    if: needs.changes.outputs.app == 'true' && needs.play.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(grep -E '^\s*versionCode\s*=' app/build.gradle | grep -oE '[0-9]+')"
          name="$(grep -E '^\s*versionName\s*=' app/build.gradle | grep -oE '"[^"]+"' | tr -d '"')"
          tag="v${name}-b${code}"

          # 같은 커밋을 다시 돌렸거나(re-run) 버전을 안 올리고 두 번 머지한 경우. 덮어쓰지 않는다.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::태그 $tag 가 이미 있다. 건너뛴다"
            exit 0
          fi

          # CHANGELOG 맨 위 "## v..." 항목 전체(스토어 문구 + 상세 내역)가 릴리스 노트가 된다.
          awk '
            /^## / || /^---$/ { if (seen) exit }
            /^## v/ && !seen  { seen = 1; next }
            seen { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "(CHANGELOG 에 이 버전 항목이 없다)" > "$RUNNER_TEMP/notes.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "v$name (b$code)"
          git push origin "$tag"

          gh release create "$tag" --verify-tag \
            --title "v$name (b$code)" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "릴리스 $tag 생성: $(gh release view "$tag" --json url --jq .url)"
