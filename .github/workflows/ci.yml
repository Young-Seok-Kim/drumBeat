# push / PR 마다 유닛 테스트를 돌린다. (DailyNet 의 ci.yml 을 옮겨 온 것. 서버가 없어 앱 잡만 둔다)
name: CI

on:
  push:
    branches: [main, main_qa]
  pull_request:

# main_qa → main PR 은 auto-pr.yml 이 봇으로 만든다. main_qa push 에서 이미 돌았으므로 그 PR 에서는 건너뛴다.
# 같은 브랜치에 연달아 push하면 앞의 실행은 취소한다 (러너 낭비 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: 앱 유닛 테스트 (android)
    if: github.event_name != 'pull_request' || github.head_ref != 'main_qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: 유닛 테스트
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
